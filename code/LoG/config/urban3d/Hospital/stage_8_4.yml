num_workers: &num_workers 4

NAIVE_STAGE:
  init:
    loader:
      module: iteration
      args:
        batch_size: 1
        iterations: 100
        num_workers: *num_workers
    dataset_state:
      scale: 8
    model_state: {}
  tree:
    ckptname: /workspace/t2024/LoG/output/urban3d/Hospital/log/model_tree_colors_k.pth
    loader:
      module: iteration
      args:
        batch_size: 1
        iterations: 200
        num_workers: *num_workers
    dataset_state:
      scale: 4
    render_state:
      render_depth: False
    model_state:
      enable_sh: True
  tree_colors:
    loader:
      module: iteration
      args:
        batch_size: 1
        iterations: 400
        num_workers: *num_workers
    dataset_state:
      scale: 4
    render_state:
      render_depth: False
    model_state:
      enable_sh: True
