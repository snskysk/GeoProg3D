root: /workspace/t2024/LangSplat/data/citygen/US-NewYork-60WashingtonSquareS-R250-A353
PLYNAME: /workspace/t2024/LangSplat/data/citygen/US-NewYork-60WashingtonSquareS-R250-A353/sparse/0/sparse.npz
scale3d: 1.
xyz_scale: 1.
language_feature_path: /workspace/t2024/LangSplat/data/citygen/US-NewYork-60WashingtonSquareS-R250-A353/language_features_dim3/
sam_feature_level: 0

dataset:
  module: LoG.dataset.colmap.ImageDataset
  args:
    root: $root
    pre_undis: True
    share_camera: False
    scales: [1, 2]
    crop_size: [-1, -1]
    znear: 0.001
    zfar: 100.
    scale3d: $scale3d
    ext: .jpeg
  
val_dataset:
  module: LoG.dataset.colmap.ImageDataset
  args:
    root: $root
    namelist: 
      - US-NewYork-60WashingtonSquareS-R250-A353_09
      - US-NewYork-60WashingtonSquareS-R250-A353_19
      - US-NewYork-60WashingtonSquareS-R250-A353_29
      - US-NewYork-60WashingtonSquareS-R250-A353_39
      - US-NewYork-60WashingtonSquareS-R250-A353_49
      - US-NewYork-60WashingtonSquareS-R250-A353_59
    cache: cache_val.pkl
    pre_undis: True
    share_camera: False
    scales: [4]
    znear: 0.001
    zfar: 100.
    scale3d: $scale3d
    ext: .jpeg

demo_interpolate:
  model_state:
    enable_sh: True
    log_query: False
  render_state:
    background: [1., 1., 1.]
  dataset:
    module: LoG.dataset.demo.InterpolatePath
    args:
      cameras: $PLYNAME
      scale: 1
      steps: 300
      subs:
      - US-NewYork-60WashingtonSquareS-R250-A353_09
      - US-NewYork-60WashingtonSquareS-R250-A353_19
      - US-NewYork-60WashingtonSquareS-R250-A353_29
      - US-NewYork-60WashingtonSquareS-R250-A353_39
      - US-NewYork-60WashingtonSquareS-R250-A353_49
      - US-NewYork-60WashingtonSquareS-R250-A353_59
      - US-NewYork-60WashingtonSquareS-R250-A353_55

demo_level:
  model_state:
    enable_sh: True
    log_query: False
  dataset:
    module: LoG.dataset.demo.ShowLevel
    args:
      cameras: $PLYNAME
      steps: 10
      sub: US-NewYork-60WashingtonSquareS-R250-A353_09
      scale: 1

demo_pixel:
  model_state:
    enable_sh: True
    log_query: True
  dataset:
    module: LoG.dataset.demo.ShowLevel
    args:
      mode: pixel
      cameras: $PLYNAME
      steps: 300
      sub: US-NewYork-60WashingtonSquareS-R250-A353_09
      scale: 1

demo_lod:
  model_state:
    enable_sh: True
    log_query: False
  dataset:
    module: LoG.dataset.demo.ZoomInOut
    args:
      cameras: $PLYNAME
      sub: US-NewYork-60WashingtonSquareS-R250-A353_09
      zranges: [-20., 1.]
      scale: 1
      use_logspace: False