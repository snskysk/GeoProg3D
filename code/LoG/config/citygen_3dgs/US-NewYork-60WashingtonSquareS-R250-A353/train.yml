parents:
  - config/citygen_3dgs/US-NewYork-60WashingtonSquareS-R250-A353/dataset.yml
  - config/citygen_3dgs/US-NewYork-60WashingtonSquareS-R250-A353/level_of_gaussian.yml
  - config/citygen_3dgs/US-NewYork-60WashingtonSquareS-R250-A353/stage_8_4.yml

exp: output/citygen/US-NewYork-60WashingtonSquareS-R250-A353/3dgs
gpus: [3]

log_interval: 1000
save_interval: 10_000

max_steps: 750

RGB_RENDER_L1_SSIM:
  module: LoG.render.renderer.NaiveRendererAndLoss
  args:
    use_origin_render: False
    use_randback: True

train:
  dataset: $dataset
  render: $RGB_RENDER_L1_SSIM
  stages: $NAIVE_STAGE
  init:
    method: scale_min
    dataset_state:
      scale: 1

val:
  dataset: $val_dataset
  iteration: 10000